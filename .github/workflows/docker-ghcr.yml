name: Build and publish image

on:
  push:
    branches:
      - main
      - arena/01a0e3c3-arch-theme-cms
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests from forks cannot write packages, so only log in / push
      # for events that run with the repository's own GITHUB_TOKEN.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Graphite theme
            org.opencontainers.image.description=Eshobe Graphite architecture-office Next.js theme

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Register immutable artifact with Eshobe CMS
        if: github.event_name != 'pull_request'
        env:
          ESHOBE_CMS_URL: ${{ secrets.ESHOBE_CMS_URL }}
          ESHOBE_THEME_PACKAGE_ID: ${{ secrets.ESHOBE_THEME_PACKAGE_ID }}
          ESHOBE_THEME_ARTIFACT_SECRET: ${{ secrets.ESHOBE_THEME_ARTIFACT_SECRET }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          # GitHub Actions secrets are frequently stored with a trailing newline
          # or stray surrounding whitespace. Such a value still passes a bare
          # `test -n` check (it is non-empty) but, once concatenated into the
          # request URL / path / header, the embedded newline produces a
          # malformed URL and curl aborts with exit code 3. Normalise every
          # value before use so registration is deterministic.
          trim() { printf '%s' "${1:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          ESHOBE_CMS_URL="$(trim "${ESHOBE_CMS_URL:-}")"
          ESHOBE_THEME_PACKAGE_ID="$(trim "${ESHOBE_THEME_PACKAGE_ID:-}")"
          ESHOBE_THEME_ARTIFACT_SECRET="$(trim "${ESHOBE_THEME_ARTIFACT_SECRET:-}")"
          IMAGE_DIGEST="$(trim "${IMAGE_DIGEST:-}")"
          # Never build a "//api" path from a trailing slash.
          ESHOBE_CMS_URL="${ESHOBE_CMS_URL%/}"
          export ESHOBE_THEME_ARTIFACT_SECRET IMAGE_DIGEST

          missing=()
          [ -n "$ESHOBE_CMS_URL" ] || missing+=(ESHOBE_CMS_URL)
          [ -n "$ESHOBE_THEME_PACKAGE_ID" ] || missing+=(ESHOBE_THEME_PACKAGE_ID)
          [ -n "$ESHOBE_THEME_ARTIFACT_SECRET" ] || missing+=(ESHOBE_THEME_ARTIFACT_SECRET)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Cannot register theme artifact; missing/empty secrets: ${missing[*]}"
            exit 1
          fi

          case "$ESHOBE_CMS_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::ESHOBE_CMS_URL must start with http:// or https:// (got '${ESHOBE_CMS_URL}')"
              exit 1
              ;;
          esac

          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::Image digest is empty; the build/push step did not publish an image."
            exit 1
          fi

          python3 - <<'PY'
          import hashlib, hmac, json, os
          body = {
            "repository": "hamidnoshady/arch-theme-cms", "ref": os.environ["GITHUB_REF_NAME"],
            "commit": os.environ["GITHUB_SHA"], "registry": "ghcr",
            "image": "ghcr.io/hamidnoshady/arch-theme-cms", "tag": "sha-" + os.environ["GITHUB_SHA"],
            "digest": os.environ["IMAGE_DIGEST"], "workflowRunId": os.environ["GITHUB_RUN_ID"],
            "workflowRunUrl": "https://github.com/hamidnoshady/arch-theme-cms/actions/runs/" + os.environ["GITHUB_RUN_ID"],
            "platform": "linux/amd64", "provenanceAvailable": False, "sbomAvailable": False
          }
          raw = json.dumps(body, separators=(",", ":"), ensure_ascii=False).encode()
          open("artifact.json", "wb").write(raw)
          open("artifact.signature", "w").write("sha256=" + hmac.new(os.environ["ESHOBE_THEME_ARTIFACT_SECRET"].encode(), raw, hashlib.sha256).hexdigest())
          PY

          curl --fail-with-body --retry 3 --connect-timeout 15 --max-time 120 \
            -X POST "${ESHOBE_CMS_URL}/api/platform/theme-packages/${ESHOBE_THEME_PACKAGE_ID}/artifacts" \
            -H 'Content-Type: application/json' \
            -H "X-Eshobe-Signature-256: $(cat artifact.signature)" \
            --data-binary @artifact.json

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
