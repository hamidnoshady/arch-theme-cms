name: Build and publish image

on:
  push:
    branches:
      - main
      - arena/01a0e3c3-arch-theme-cms
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests from forks cannot write packages, so only log in / push
      # for events that run with the repository's own GITHUB_TOKEN.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Graphite theme
            org.opencontainers.image.description=Eshobe Graphite architecture-office Next.js theme

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Register immutable artifact with Eshobe CMS
        if: github.event_name != 'pull_request'
        env:
          ESHOBE_CMS_URL: ${{ secrets.ESHOBE_CMS_URL }}
          ESHOBE_THEME_PACKAGE_ID: ${{ secrets.ESHOBE_THEME_PACKAGE_ID }}
          ESHOBE_THEME_ARTIFACT_SECRET: ${{ secrets.ESHOBE_THEME_ARTIFACT_SECRET }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$ESHOBE_CMS_URL" && test -n "$ESHOBE_THEME_PACKAGE_ID" && test -n "$ESHOBE_THEME_ARTIFACT_SECRET"
          python3 - <<'PY'
          import hashlib, hmac, json, os
          body = {
            "repository": "hamidnoshady/arch-theme-cms", "ref": os.environ["GITHUB_REF_NAME"],
            "commit": os.environ["GITHUB_SHA"], "registry": "ghcr",
            "image": "ghcr.io/hamidnoshady/arch-theme-cms", "tag": "sha-" + os.environ["GITHUB_SHA"],
            "digest": os.environ["IMAGE_DIGEST"], "workflowRunId": os.environ["GITHUB_RUN_ID"],
            "workflowRunUrl": "https://github.com/hamidnoshady/arch-theme-cms/actions/runs/" + os.environ["GITHUB_RUN_ID"],
            "platform": "linux/amd64", "provenanceAvailable": False, "sbomAvailable": False
          }
          raw = json.dumps(body, separators=(",", ":"), ensure_ascii=False).encode()
          open("artifact.json", "wb").write(raw)
          open("artifact.signature", "w").write("sha256=" + hmac.new(os.environ["ESHOBE_THEME_ARTIFACT_SECRET"].encode(), raw, hashlib.sha256).hexdigest())
          PY
          curl --fail-with-body --retry 3 -X POST "$ESHOBE_CMS_URL/api/platform/theme-packages/$ESHOBE_THEME_PACKAGE_ID/artifacts" \
            -H 'Content-Type: application/json' -H "X-Eshobe-Signature-256: $(cat artifact.signature)" --data-binary @artifact.json

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
