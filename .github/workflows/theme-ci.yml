name: Theme CI

on:
  push:
    branches:
      - main
      - arena/01a0cee3-arch-theme-cms
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-test:
    name: Test Graphite theme
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate theme manifest
        run: |
          node -e "
          const fs = require('node:fs');
          const m = require('./eshobe.theme.json');
          const runtimeSrc = fs.readFileSync('vendor/site-runtime/src/index.ts', 'utf8');
          const match = runtimeSrc.match(/export const contractVersion = (\\d+)/);
          if (!match) {
            console.error('contractVersion not found in vendor/site-runtime');
            process.exit(1);
          }
          const contractVersion = Number(match[1]);
          if (m.contractVersion !== contractVersion) {
            console.error('contractVersion mismatch', { manifest: m.contractVersion, runtime: contractVersion });
            process.exit(1);
          }
          const health = m.build?.healthCheckPath || m.healthCheck;
          const ok =
            m.name &&
            m.key &&
            m.version &&
            m.contractVersion &&
            Array.isArray(m.siteTypes) &&
            m.siteTypes.length &&
            typeof health === 'string' &&
            health.startsWith('/') &&
            m.build?.port >= 1 &&
            m.build?.buildPack === 'dockerfile' &&
            m.build?.dockerfileLocation === 'Dockerfile' &&
            m.deployment?.strategy === 'registry_image' &&
            m.deployment?.registryProvider === 'ghcr' &&
            m.deployment?.registryImageRepository === 'ghcr.io/hamidnoshady/arch-theme-cms';
          if (!ok) {
            console.error('eshobe.theme.json missing Wave 11 required fields', {
              name: m.name,
              key: m.key,
              version: m.version,
              contractVersion: m.contractVersion,
              siteTypes: m.siteTypes,
              healthCheckPath: health,
              port: m.build?.port,
            });
            process.exit(1);
          }
          "

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production theme
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
