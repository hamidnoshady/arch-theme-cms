services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - graphite-db:/var/lib/mysql
  wordpress:
    image: wordpress:6.7-php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - ./plugins/graphite-core:/var/www/html/wp-content/plugins/graphite-core
      - ./theme/graphite:/var/www/html/wp-content/themes/graphite
volumes:
  graphite-db:
